  <script>
    (function() {
      // 1. DATA STATE & STORAGE
      const STORAGE_KEY_TOURS = 'bracketx_standalone_tournaments';
      const STORAGE_KEY_USER = 'bracketx_standalone_user';
      const STORAGE_KEY_CFG = 'bracketx_standalone_cfg';

      let currentUser = JSON.parse(localStorage.getItem(STORAGE_KEY_USER) || 'null') || {
        uid: 'user_hoanghau',
        email: 'hoanghaugrapher@gmail.com',
        displayName: 'Hoàng Hậu (BTC)',
        photoURL: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80'

      let tournaments = [];

      // Sample Data generator
      function getInitialSampleTournaments() {
        const pbTeams = [
          { id: 'pb_1', name: 'Thunder Strike', members: 'Tuấn Anh / Minh Khang', seed: 1, avatarColor: 'from-amber-500 to-orange-600' },
          { id: 'pb_2', name: 'Cyber Dinks', members: 'Hải Đăng / Quốc Huy', seed: 4, avatarColor: 'from-cyan-500 to-blue-600' },
          { id: 'pb_3', name: 'Vortex Pro', members: 'Văn Lâm / Đình Trọng', avatarColor: 'from-emerald-500 to-teal-600' },
          { id: 'pb_4', name: 'Apex Spinners', members: 'Hoàng Long / Bảo Ngọc', avatarColor: 'from-purple-500 to-indigo-600' },
          { id: 'pb_5', name: 'Neon Smashers', members: 'Quang Hải / Văn Toàn', seed: 2, avatarColor: 'from-pink-500 to-rose-600' },
          { id: 'pb_6', name: 'Falcon Wings', members: 'Duy Mạnh / Tiến Dũng', seed: 3, avatarColor: 'from-blue-500 to-cyan-600' },
          { id: 'pb_7', name: 'Dragon Paddle', members: 'Tuấn Tài / Việt Anh', avatarColor: 'from-amber-600 to-yellow-500' },

        ];

        const pbGA_teamIds = ['pb_1', 'pb_2', 'pb_3', 'pb_4'];

        const pbMatchesA = [
          { id: 'm_ga_1', groupId: 'ga', team1Id: 'pb_1', team2Id: 'pb_2', setScores: [{ team1: 11, team2: 8 }, { team1: 11, team2: 7 }, { team1: '', team2: '' }], status: 'completed', winnerId: 'pb_1' },
          { id: 'm_ga_2', groupId: 'ga', team1Id: 'pb_3', team2Id: 'pb_4', setScores: [{ team1: 11, team2: 9 }, { team1: 7, team2: 11 }, { team1: 11, team2: 9 }], status: 'completed', winnerId: 'pb_3' },
          { id: 'm_ga_3', groupId: 'ga', team1Id: 'pb_1', team2Id: 'pb_3', setScores: [{ team1: 11, team2: 6 }, { team1: 11, team2: 8 }, { team1: '', team2: '' }], status: 'completed', winnerId: 'pb_1' },
          { id: 'm_ga_4', groupId: 'ga', team1Id: 'pb_2', team2Id: 'pb_4', setScores: [{ team1: 11, team2: 5 }, { team1: 11, team2: 7 }, { team1: '', team2: '' }], status: 'completed', winnerId: 'pb_2' }
        ];

        const pbMatchesB = [
          { id: 'm_gb_1', groupId: 'gb', team1Id: 'pb_5', team2Id: 'pb_6', setScores: [{ team1: 11, team2: 7 }, { team1: 11, team2: 9 }, { team1: '', team2: '' }], status: 'completed', winnerId: 'pb_5' },
          { id: 'm_gb_2', groupId: 'gb', team1Id: 'pb_7', team2Id: 'pb_8', setScores: [{ team1: 11, team2: 8 }, { team1: 11, team2: 6 }, { team1: '', team2: '' }], status: 'completed', winnerId: 'pb_7' }
        ];

        const pbSettings = { pointsPerWin: 1, pointsPerDraw: 0, pointsPerLoss: 0, maxSets: 3, pointsToWinSet: 11, winByTwo: true };

        const groups = [
          { id: 'ga', name: 'Bảng A', teamIds: pbGA_teamIds, matches: pbMatchesA, standings: [] },
          { id: 'gb', name: 'Bảng B', teamIds: pbGB_teamIds, matches: pbMatchesB, standings: [] }
        ];

        groups.forEach(g => {
          g.standings = calculateStandings(g.teamIds, g.matches, 'pickleball', pbSettings);
        });

        const ko = generateKnockout(groups, 'pickleball');

        return [{
          id: 'tour_pickleball_2026',
          title: 'Giải Pickleball Vô Địch Mở Rộng BracketX 2026',
          sport: 'pickleball',
          category: 'doubles',
          creatorEmail: 'hoanghaugrapher@gmail.com',
          sharedEmails: ['referee.pro@bracketx.com', 'admin@tournament.vn'],
          status: 'group_stage',
          groupsCount: 2,
          teams: pbTeams,
          groups,
          knockout: ko,
          settings: pbSettings,
          location: 'Sân Trung Tâm Thể Thao Pro - TP. Hồ Chí Minh'
        }];
      }

      // Tiebreak Standings Calculator (Điểm -> Đối đầu -> Hiệu số -> Điểm ghi)
      function calculateStandings(teamIds, matches, sport, settings) {
        const stats = {};
        teamIds.forEach(id => {
          stats[id] = { teamId: id, rank: 1, played: 0, won: 0, drawn: 0, lost: 0, setsWon: 0, setsLost: 0, pointsWon: 0, pointsLost: 0, setDiff: 0, pointDiff: 0, points: 0 };
        });

        matches.forEach(m => {
          if (!m.team1Id || !m.team2Id) return;
          const t1 = stats[m.team1Id];
          const t2 = stats[m.team2Id];
          if (!t1 || !t2) return;

          const ev = evalMatch(m, sport, settings);
          if (!ev.isDecided) return;

          t1.played++; t2.played++;
          t1.setsWon += ev.team1Sets; t1.setsLost += ev.team2Sets;
          t2.setsWon += ev.team2Sets; t2.setsLost += ev.team1Sets;

          m.setScores.forEach(s => {
            if (s && s.team1 !== '' && s.team2 !== '') {
              const p1 = Number(s.team1), p2 = Number(s.team2);
              t1.pointsWon += p1; t1.pointsLost += p2;
              t2.pointsWon += p2; t2.pointsLost += p1;
            }
          });

          if (ev.winnerId === m.team1Id) {
            t1.won++; t1.points += (settings.pointsPerWin || 1);
            t2.lost++;
          } else if (ev.winnerId === m.team2Id) {
            t2.won++; t2.points += (settings.pointsPerWin || 1);
            t1.lost++;
          } else {
            t1.drawn++; t2.drawn++;
            t1.points += (settings.pointsPerDraw || 1);
            t2.points += (settings.pointsPerDraw || 1);
          }
        });

        const list = Object.values(stats);
        list.forEach(st => {
          st.setDiff = st.setsWon - st.setsLost;
          st.pointDiff = st.pointsWon - st.pointsLost;
        });

        list.sort((a, b) => {
          if (b.points !== a.points) return b.points - a.points;
          // Head to head
          const h2h = matches.find(m => (m.team1Id === a.teamId && m.team2Id === b.teamId) || (m.team1Id === b.teamId && m.team2Id === a.teamId));
          if (h2h) {
            const eh = evalMatch(h2h, sport, settings);
            if (eh.isDecided && eh.winnerId) {
              if (eh.winnerId === a.teamId) return -1;
              if (eh.winnerId === b.teamId) return 1;
            }
          }
          if (b.setDiff !== a.setDiff) return b.setDiff - a.setDiff;
          if (b.pointDiff !== a.pointDiff) return b.pointDiff - a.pointDiff;
          return b.pointsWon - a.pointsWon;
        });

        list.forEach((st, idx) => st.rank = idx + 1);
        return list;
      }

      // Bo3 Match Evaluator
      function evalMatch(match, sport, settings) {
        if (!match.team1Id || !match.team2Id) {
          return { team1Sets: 0, team2Sets: 0, isDecided: false, winnerId: null, lockedSets: [false, false, false] };
        }
        let team1Sets = 0, team2Sets = 0;
        const lockedSets = [false, false, false];
        const target = settings.pointsToWinSet || 11;

        for (let i = 0; i < 3; i++) {
          const s = match.setScores[i];
          if (!s || s.team1 === '' || s.team2 === '') continue;
          const s1 = Number(s.team1), s2 = Number(s.team2);
          if ((s1 >= target || s2 >= target) && Math.abs(s1 - s2) >= (settings.winByTwo ? 2 : 1)) {
            if (s1 > s2) team1Sets++;
            else team2Sets++;
          }
        }

        const isDecided = team1Sets === 2 || team2Sets === 2;
        const winnerId = isDecided ? (team1Sets === 2 ? match.team1Id : match.team2Id) : null;
        if (isDecided && (team1Sets + team2Sets === 2)) {
          lockedSets[2] = true;
        }

        return { team1Sets, team2Sets, isDecided, winnerId, lockedSets };
      }

      // Knockout generator
      function generateKnockout(groups, sport) {
        const gA = groups[0], gB = groups[1] || groups[0];
        const getRankTeam = (g, rank) => g?.standings?.find(s => s.rank === rank)?.teamId || null;

        const finalMatch = {
          id: 'ko_final', roundIndex: 2, name: 'Chung Kết',
          team1Id: null, team2Id: null,
          team1Placeholder: 'Thắng Bán Kết 1', team2Placeholder: 'Thắng Bán Kết 2',
          setScores: [{ team1: '', team2: '' }, { team1: '', team2: '' }, { team1: '', team2: '' }],
          status: 'scheduled', winnerId: null
        };

        const sf1 = {
          id: 'ko_sf1', roundIndex: 1, name: 'Bán Kết 1',
          team1Id: getRankTeam(gA, 1), team2Id: getRankTeam(gB, 2),
          team1Placeholder: 'Nhất Bảng A', team2Placeholder: 'Nhì Bảng B',
          nextMatchId: 'ko_final', nextMatchSlot: 'team1',
          setScores: [{ team1: '', team2: '' }, { team1: '', team2: '' }, { team1: '', team2: '' }],
          status: 'scheduled', winnerId: null
        };

        const sf2 = {
          id: 'ko_sf2', roundIndex: 1, name: 'Bán Kết 2',
          team1Id: getRankTeam(gB, 1), team2Id: getRankTeam(gA, 2),
          team1Placeholder: 'Nhất Bảng B', team2Placeholder: 'Nhì Bảng A',
          nextMatchId: 'ko_final', nextMatchSlot: 'team2',
          setScores: [{ team1: '', team2: '' }, { team1: '', team2: '' }, { team1: '', team2: '' }],
          status: 'scheduled', winnerId: null
        };

        return {
          enabled: true,
          rounds: [
            { roundIndex: 1, name: 'Bán Kết', matches: [sf1, sf2] },
            { roundIndex: 2, name: 'Chung Kết', matches: [finalMatch] }
          ],
          championId: null, runnerUpId: null
        };
      }

      // 2. DATA PERSISTENCE & SYNC
      async function loadTournaments() {
        const raw = localStorage.getItem(STORAGE_KEY_TOURS);
        if (raw) {
          try { tournaments = JSON.parse(raw); } catch (e) { tournaments = []; }
        }
        if (!tournaments || tournaments.length === 0) {
          tournaments = getInitialSampleTournaments();
          localStorage.setItem(STORAGE_KEY_TOURS, JSON.stringify(tournaments));
        }

        // Check if Firebase db exists
        if (window.__BX_FIREBASE && window.__BX_FIREBASE.db) {
          try {
            const { collection, getDocs } = window.__BX_FIREBASE;
            const snap = await getDocs(collection(window.__BX_FIREBASE.db, 'tournaments'));
            const cloudTours = [];
            snap.forEach(d => cloudTours.push(d.data()));
            if (cloudTours.length > 0) {
              tournaments = cloudTours;
              localStorage.setItem(STORAGE_KEY_TOURS, JSON.stringify(tournaments));
            }
          } catch (e) {
            console.warn('Firestore fetch notice:', e);
          }
        }

        if (tournaments.length > 0) {
          selectedTournamentId = tournaments[0].id;
        }
      }

      async function saveCurrentTour(t) {
        const idx = tournaments.findIndex(item => item.id === t.id);
        if (idx >= 0) tournaments[idx] = t;
        else tournaments.unshift(t);
        localStorage.setItem(STORAGE_KEY_TOURS, JSON.stringify(tournaments));

        // Firestore save
        if (window.__BX_FIREBASE && window.__BX_FIREBASE.db) {
          try {
            const { doc, setDoc } = window.__BX_FIREBASE;
            await setDoc(doc(window.__BX_FIREBASE.db, 'tournaments', t.id), t, { merge: true });
          } catch (e) {
            console.warn('Firestore save notice:', e);
          }
        }
      }

      // 3. UI RENDERING CORE

              Chuẩn hóa bốc thăm vòng bảng, tính điểm đối đầu tự động, sơ đồ nhánh đấu Knockout Bo3 và tối ưu Firebase Spark Plan.
            </p>

            <!-- TOURNAMENT SELECTOR CHIPS -->
            <div class="flex items-center justify-center gap-2 overflow-x-auto pb-2">
              ${tournaments.map(t => `
                <button onclick="window.__bxSelectTour('${t.id}')" class="px-3.5 py-2 rounded-xl text-xs font-semibold border transition-all whitespace-nowrap ${

      // 4. GLOBAL INTERACTION HANDLERS
      window.__bxSelectTour = id => {
        selectedTournamentId = id;
        renderApp();
      };

      window.__bxSetTab = tab => {
        activeTab = tab;
        renderApp();
      };

      window.__bxToggleUserMenu = () => {
        const menu = document.getElementById('user-dropdown');
        if (menu) menu.classList.toggle('hidden');
      };

      window.__bxSimulateUser = role => {
        const cur = tournaments.find(t => t.id === selectedTournamentId) || tournaments[0];
        if (role === 'creator') {
          currentUser = { uid: 'u_creator', email: cur?.creatorEmail || 'hoanghaugrapher@gmail.com', displayName: 'Hoàng Hậu (BTC)' };
        } else if (role === 'referee') {
          currentUser = { uid: 'u_ref', email: cur?.sharedEmails?.[0] || 'referee.pro@bracketx.com', displayName: 'Trọng Tài Quốc Gia' };
        } else {
          currentUser = { uid: 'u_guest', email: 'guest@viewer.com', displayName: 'Khách Xem Giải' };
        }
        localStorage.setItem(STORAGE_KEY_USER, JSON.stringify(currentUser));
        window.__bxToggleUserMenu();
        renderApp();
      };

      window.__bxUpdateMatchScore = (groupId, matchId, setIdx, t1, t2) => {
        const cur = tournaments.find(t => t.id === selectedTournamentId);
        if (!cur) return;
        const grp = cur.groups.find(g => g.id === groupId);
        if (!grp) return;
        const m = grp.matches.find(item => item.id === matchId);
        if (!m) return;

        m.setScores[setIdx] = { team1: t1 === '' ? '' : Number(t1), team2: t2 === '' ? '' : Number(t2) };
        const ev = evalMatch(m, cur.sport, cur.settings);
        m.status = ev.isDecided ? 'completed' : 'playing';
        m.winnerId = ev.winnerId;

        grp.standings = calculateStandings(grp.teamIds, grp.matches, cur.sport, cur.settings);
        saveCurrentTour(cur);
        renderApp();
      };

      window.__bxUpdateKnockoutScore = (roundIndex, matchId, setIdx, t1, t2) => {
        const cur = tournaments.find(t => t.id === selectedTournamentId);
        if (!cur) return;
        const r = cur.knockout.rounds.find(item => item.roundIndex === roundIndex);
        if (!r) return;
        const m = r.matches.find(item => item.id === matchId);
        if (!m) return;

        m.setScores[setIdx] = { team1: t1 === '' ? '' : Number(t1), team2: t2 === '' ? '' : Number(t2) };
        const ev = evalMatch(m, cur.sport, cur.settings);
        m.status = ev.isDecided ? 'completed' : 'playing';
        m.winnerId = ev.winnerId;

        // Auto advance to next match
        if (ev.winnerId && m.nextMatchId) {
          for (const nextR of cur.knockout.rounds) {
            const nextM = nextR.matches.find(item => item.id === m.nextMatchId);
            if (nextM) {
              if (m.nextMatchSlot === 'team1') nextM.team1Id = ev.winnerId;
              else nextM.team2Id = ev.winnerId;
            }
          }
        }

        // Check final
        const finalRound = cur.knockout.rounds[cur.knockout.rounds.length - 1];
        const finalMatch = finalRound?.matches[0];
        if (finalMatch && finalMatch.winnerId) {
          cur.knockout.championId = finalMatch.winnerId;
          try {
            confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
          } catch(e){}
        }

        saveCurrentTour(cur);
        renderApp();
      };

      window.__bxRedrawGroups = () => {
        const cur = tournaments.find(t => t.id === selectedTournamentId);
        if (!cur) return;
        if (!confirm('Bốc thăm lại bảng đấu sẽ tạo mới lịch thi đấu. Tiếp tục?')) return;

        cur.groups.forEach(g => {
          g.matches.forEach(m => {
            m.setScores = [{ team1: '', team2: '' }, { team1: '', team2: '' }, { team1: '', team2: '' }];
            m.status = 'scheduled';
            m.winnerId = null;
          });
          g.standings = calculateStandings(g.teamIds, g.matches, cur.sport, cur.settings);
        });

        cur.knockout = generateKnockout(cur.groups, cur.sport);
        saveCurrentTour(cur);
        renderApp();
      };

      // Modals
      window.__bxOpenShareModal = () => {
        const cur = tournaments.find(t => t.id === selectedTournamentId);
        if (!cur) return;
        const modal = document.getElementById('modal-root');
        modal.innerHTML = `
          <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
            <div class="bg-[#0b101f] border border-slate-700 rounded-2xl w-full max-w-md p-6 text-left shadow-2xl">
              <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
                <h3 class="font-heading font-bold text-lg text-white">Cài Đặt & Chia Sẻ Quyền</h3>
                <button onclick="document.getElementById('modal-root').innerHTML=''" class="text-slate-400 hover:text-white">&times;</button>
              </div>
              <div class="space-y-4 text-xs">
                <div>
                  <label class="block text-slate-300 font-semibold mb-1">Email Người Tạo (BTC):</label>
                  <input type="text" id="cfg-creator" value="${cur.creatorEmail}" class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-white outline-none">
                </div>
                <div>
                  <label class="block text-slate-300 font-semibold mb-1">Email Trọng Tài (Cùng sửa điểm):</label>
                  <input type="text" id="cfg-shared" value="${(cur.sharedEmails || []).join(', ')}" placeholder="email1@gmail.com, email2@gmail.com" class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-white outline-none">
                  <p class="text-[11px] text-slate-400 mt-1">Cách nhau bằng dấu phẩy.</p>
                </div>
              </div>
              <div class="flex justify-end gap-2 mt-6 pt-3 border-t border-slate-800">
                <button onclick="document.getElementById('modal-root').innerHTML=''" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white">Hủy</button>
                <button onclick="window.__bxSaveShareCfg()" class="px-4 py-2 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white font-semibold">Lưu Thay Đổi</button>
              </div>
            </div>
          </div>
        `;
      };

      window.__bxSaveShareCfg = () => {
        const cur = tournaments.find(t => t.id === selectedTournamentId);
        if (!cur) return;
        const cr = document.getElementById('cfg-creator').value.trim();
        const sh = document.getElementById('cfg-shared').value.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
        cur.creatorEmail = cr;
        cur.sharedEmails = sh;
        saveCurrentTour(cur);
        document.getElementById('modal-root').innerHTML = '';
        renderApp();
      };

      window.__bxOpenCfgModal = () => {
        const cfg = JSON.parse(localStorage.getItem(STORAGE_KEY_CFG) || '{}');
        const modal = document.getElementById('modal-root');
        modal.innerHTML = `
          <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
            <div class="bg-[#0b101f] border border-slate-700 rounded-2xl w-full max-w-md p-6 text-left shadow-2xl">
              <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
                <h3 class="font-heading font-bold text-lg text-white">Cấu Hình Firebase Spark Plan</h3>
                <button onclick="document.getElementById('modal-root').innerHTML=''" class="text-slate-400 hover:text-white">&times;</button>
              </div>
              <div class="space-y-3 text-xs">
                <div>
                  <label class="block text-slate-300 font-semibold mb-1">apiKey</label>
                  <input type="text" id="fb-apiKey" value="${cfg.apiKey || ''}" class="w-full px-2.5 py-1.5 rounded bg-slate-900 border border-slate-700 text-white outline-none">
                </div>
                <div>
                  <label class="block text-slate-300 font-semibold mb-1">projectId</label>
                  <input type="text" id="fb-projectId" value="${cfg.projectId || ''}" class="w-full px-2.5 py-1.5 rounded bg-slate-900 border border-slate-700 text-white outline-none">
                </div>
                <div>
                  <label class="block text-slate-300 font-semibold mb-1">appId</label>
                  <input type="text" id="fb-appId" value="${cfg.appId || ''}" class="w-full px-2.5 py-1.5 rounded bg-slate-900 border border-slate-700 text-white outline-none">
                </div>
              </div>
              <div class="flex justify-end gap-2 mt-6 pt-3 border-t border-slate-800">
                <button onclick="document.getElementById('modal-root').innerHTML=''" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white">Đóng</button>
                <button onclick="window.__bxSaveFirebaseCfg()" class="px-4 py-2 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white font-semibold">Lưu & Tải lại</button>
              </div>
            </div>
          </div>
        `;
      };

      window.__bxSaveFirebaseCfg = () => {
        const cfg = {
          apiKey: document.getElementById('fb-apiKey').value.trim(),
          projectId: document.getElementById('fb-projectId').value.trim(),
          appId: document.getElementById('fb-appId').value.trim()
        };
        localStorage.setItem(STORAGE_KEY_CFG, JSON.stringify(cfg));
        location.reload();
      };

      window.__bxOpenNewTourModal = () => {
        const modal = document.getElementById('modal-root');
        modal.innerHTML = `
          <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
            <div class="bg-[#0b101f] border border-slate-700 rounded-2xl w-full max-w-md p-6 text-left shadow-2xl">
              <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
                <h3 class="font-heading font-bold text-lg text-white">Tạo Giải Đấu Mới</h3>
                <button onclick="document.getElementById('modal-root').innerHTML=''" class="text-slate-400 hover:text-white">&times;</button>
              </div>
              <div class="space-y-3 text-xs">
                <div>
                  <label class="block text-slate-300 font-semibold mb-1">Tên Giải Đấu:</label>
                  <input type="text" id="new-title" placeholder="Giải Pickleball Mùa Hè 2026" class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-white outline-none">
                </div>
                <div>
                  <label class="block text-slate-300 font-semibold mb-1">Môn Thi Đấu:</label>
                  <select id="new-sport" class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-white outline-none">
                    <option value="pickleball">🏓 Pickleball (Bo3 11 điểm)</option>
                    <option value="badminton">🏸 Cầu Lông (Bo3 21 điểm)</option>
                    <option value="football">⚽ Bóng Đá</option>
                  </select>
                </div>
              </div>
              <div class="flex justify-end gap-2 mt-6 pt-3 border-t border-slate-800">
                <button onclick="document.getElementById('modal-root').innerHTML=''" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white">Hủy</button>
                <button onclick="window.__bxCreateTourSubmit()" class="px-4 py-2 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white font-semibold">+ Khởi Tạo</button>
              </div>
            </div>
          </div>
        `;
      };

      window.__bxCreateTourSubmit = () => {
        const title = document.getElementById('new-title').value.trim();
        const sport = document.getElementById('new-sport').value;
        if (!title) return;

        const newTour = {
          id: 'tour_' + Date.now(),
          title,
          sport,
          category: 'doubles',
          creatorEmail: currentUser?.email || 'hoanghaugrapher@gmail.com',
          sharedEmails: [],
          status: 'group_stage',
          groupsCount: 2,
          teams: [
            { id: 't1', name: 'Đội 1', members: 'VĐV 1A / 1B' },
            { id: 't2', name: 'Đội 2', members: 'VĐV 2A / 2B' },
            { id: 't3', name: 'Đội 3', members: 'VĐV 3A / 3B' },
            { id: 't4', name: 'Đội 4', members: 'VĐV 4A / 4B' }
          ],
          groups: [
            {
              id: 'g1', name: 'Bảng A', teamIds: ['t1', 't2', 't3', 't4'],
              matches: [
                { id: 'm1', groupId: 'g1', team1Id: 't1', team2Id: 't2', setScores: [{ team1: '', team2: '' }, { team1: '', team2: '' }, { team1: '', team2: '' }], status: 'scheduled', winnerId: null },
                { id: 'm2', groupId: 'g1', team1Id: 't3', team2Id: 't4', setScores: [{ team1: '', team2: '' }, { team1: '', team2: '' }, { team1: '', team2: '' }], status: 'scheduled', winnerId: null }
              ],
              standings: []
            }
          ],
          knockout: {
            enabled: true,
            rounds: [
              {
                roundIndex: 1, name: 'Chung Kết',
                matches: [{ id: 'f1', roundIndex: 1, name: 'Chung Kết', team1Id: 't1', team2Id: 't2', setScores: [{ team1: '', team2: '' }, { team1: '', team2: '' }, { team1: '', team2: '' }], status: 'scheduled', winnerId: null }]
              }
            ],
            championId: null
          },
          settings: { pointsPerWin: 1, maxSets: 3, pointsToWinSet: sport === 'badminton' ? 21 : 11, winByTwo: true }
        };

        newTour.groups[0].standings = calculateStandings(newTour.groups[0].teamIds, newTour.groups[0].matches, newTour.sport, newTour.settings);
        tournaments.unshift(newTour);
        selectedTournamentId = newTour.id;
        saveCurrentTour(newTour);
        document.getElementById('modal-root').innerHTML = '';
        renderApp();
      };

      // 5. BOOTSTRAP INITIALIZATION
      async function init() {
        console.log("BracketX Pro Engine Bootstrapping...");
        await loadTournaments();
        renderApp();
      }

      window.__initBracketXApp = init;
      window.addEventListener('bx-firebase-ready', init);

      // DOM fallback to guarantee it never stays stuck
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        setTimeout(init, 50);
      }
    })();
  </script>
</body>
</html>
